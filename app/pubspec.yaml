name: reiseplayer
description: Offline music and video player with free music discovery.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.7
  just_audio: ^0.10.6
  video_player: ^2.10.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
