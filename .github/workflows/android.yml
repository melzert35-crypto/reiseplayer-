
name: ReisePlayer Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter-Version anzeigen
        run: flutter --version

      - name: Android-Projekt vorbereiten
        working-directory: app
        run: |
          flutter create --platforms=android --org de.reiseplayer --project-name reiseplayer build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp analysis_options.yaml build_app/analysis_options.yaml
          mkdir -p build_app/lib
          cp -R lib/. build_app/lib/

      - name: Android-Konfiguration kontrollieren
        working-directory: app/build_app
        run: |
          echo "Verwendete Android-Konfiguration:"
          grep -nE 'compileSdk|minSdk|targetSdk' android/app/build.gradle.kts

      - name: Abhängigkeiten laden
        working-directory: app/build_app
        run: flutter pub get

      - name: Flutter analysieren
        working-directory: app/build_app
        run: |
          rm -rf test
          flutter analyze

      - name: Release-APK bauen
        working-directory: app/build_app
        run: flutter build apk --release

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: reiseplayer-android-apk
          path: app/build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
