name: ReisePlayer Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Create Android Flutter project
        run: flutter create --platforms=android --org de.reiseplayer --project-name reiseplayer build_app

      - name: Copy app source
        run: |
          cp app/pubspec.yaml build_app/pubspec.yaml
          cp app/analysis_options.yaml build_app/analysis_options.yaml
          mkdir -p build_app/lib
          cp app/lib/main.dart build_app/lib/main.dart

      - name: Set Android compile SDK to 36
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          content = path.read_text()
          lines = content.splitlines()
          for i, line in enumerate(lines):
              if "compileSdk" in line:
                  lines[i] = "    compileSdk = 36"
                  break
          else:
              raise SystemExit("compileSdk-Zeile nicht gefunden")
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reiseplayer-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
