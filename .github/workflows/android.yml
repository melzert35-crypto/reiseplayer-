
name: ReisePlayer Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Android-Projekt vorbereiten
        working-directory: app
        run: |
          flutter create --platforms=android --org de.reiseplayer --project-name reiseplayer build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp analysis_options.yaml build_app/analysis_options.yaml
          mkdir -p build_app/lib
          cp -R lib/. build_app/lib/

      - name: Android Gradle-Konfiguration korrigieren
        working-directory: app/build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              kotlin = True
          elif groovy.exists():
              path = groovy
              kotlin = False
          else:
              raise SystemExit("Android-Gradle-Datei nicht gefunden")

          lines = path.read_text().splitlines()
          result = []

          for line in lines:
              indent = re.match(r"^\s*", line).group(0)

              if re.match(r"^\s*(compileSdk|compileSdkVersion)\b", line):
                  line = indent + ("compileSdk = 36" if kotlin else "compileSdkVersion 36")

              elif re.match(r"^\s*(minSdk|minSdkVersion)\b", line):
                  line = indent + ("minSdk = 23" if kotlin else "minSdkVersion 23")

              result.append(line)

          path.write_text("\n".join(result) + "\n")
          print("Gradle-Datei korrigiert:", path)
          print(path.read_text())
          PY

      - name: Abhängigkeiten laden
        working-directory: app/build_app
        run: flutter pub get

      - name: Flutter analysieren
        working-directory: app/build_app
        run: |
          rm -rf test
          flutter analyze

      - name: Release-APK bauen
        working-directory: app/build_app
        run: flutter build apk --release

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: reiseplayer-android-apk
          path: app/build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
