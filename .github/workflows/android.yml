
name: ReisePlayer Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Android-Projekt vorbereiten
        working-directory: app
        run: |
          flutter create --platforms=android --org de.reiseplayer --project-name reiseplayer build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp analysis_options.yaml build_app/analysis_options.yaml
          mkdir -p build_app/lib
          cp -R lib/. build_app/lib/

      - name: Android Gradle-Konfiguration korrigieren
        working-directory: app/build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          found = False

          for path in files:
              if not path.exists():
                  continue

              found = True
              is_kotlin = path.suffix == ".kts"
              lines = path.read_text().splitlines()
              fixed = []

              for line in lines:
                  indent = line[:len(line) - len(line.lstrip())]

                  if "flutter.minSdkVersion" in line:
                      line = indent + (
                          "minSdk = 23" if is_kotlin
                          else "minSdkVersion 23"
                      )

                  elif "flutter.compileSdkVersion" in line:
                      line = indent + (
                          "compileSdk = 36" if is_kotlin
                          else "compileSdkVersion 36"
                      )

                  fixed.append(line)

              path.write_text("\n".join(fixed) + "\n")

              print("Geprüft:", path)
              for number, line in enumerate(fixed, 1):
                  if "minSdk" in line or "compileSdk" in line:
                      print(number, line)

              if "flutter.minSdkVersion" in "\n".join(fixed):
                  raise SystemExit("FEHLER: minSdk wurde nicht korrigiert")

          if not found:
              raise SystemExit("FEHLER: Keine Gradle-Datei gefunden")
          PY

      - name: Abhängigkeiten laden
        working-directory: app/build_app
        run: flutter pub get

      - name: Flutter analysieren
        working-directory: app/build_app
        run: |
          rm -rf test
          flutter analyze

      - name: Release-APK bauen
        working-directory: app/build_app
        run: flutter build apk --release

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: reiseplayer-android-apk
          path: app/build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
